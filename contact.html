<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hubungi Saya - Blog Pribadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1 class="site-title"><a href="index.html">Blog Pribadi</a></h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="contact-hero">
      <img src="images/contact-placeholder.png" alt="Ilustrasi placeholder untuk halaman kontak blog" width="1200" height="300" />
    </section>

    <section class="contact-content">
      <h2>Hubungi Saya</h2>
      <p>Jika Anda memiliki pertanyaan atau ingin berkolaborasi, silakan kirim pesan melalui formulir di bawah ini.</p>
      <form class="contact-form" action="#" method="POST">
        <label for="name">Nama</label>
        <input type="text" id="name" name="name" placeholder="Nama Anda" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email Anda" required />

        <label for="message">Pesan</label>
        <textarea id="message" name="message" rows="5" placeholder="Tulis pesan Anda di sini..." required></textarea>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Blog Pribadi. Dibuat oleh <strong>Nabil Najwa Akmal</strong>.</p>
    </div>
  </footer>
</body>
</html>
